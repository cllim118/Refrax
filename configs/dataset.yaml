# EXAMPLE values for a GoPro 10 in Linear mode (refrax-dataset).
# Replace them with your own camera, housing and paths.

# In-air pinhole intrinsics (px) and optional radial-tangential distortion
camera:
  W: 1920
  H: 1080
  fx: 919.896
  fy: 920.235
  cx: 959.324
  cy: 544.850
  k1: 0.01749284
  k2: -0.00298329
  p1: 0.00171351
  p2: 0.00045356

# Flat-port housing. Lengths in the same unit as depths (metres here).
housing:
  n_port: [0.0, 0.0, 1.0]   # port normal in the camera frame
  mu_a: 1.0                 # refractive index of air
  mu_g: 1.47                # refractive index of the port glass
  mu_w: 1.34                # refractive index of water
  rflat: 0.02               # camera centre to inner port surface
  tglass: 0.002             # port thickness

paths:
  rgb_dir: "./input/rgb"
  output_dir: "./output/corrected"
  mask_dir: "./output/mask"
  depth_dir: null   # null = single fixed depth (z0_fixed); else per-image <name>.npy depth maps
  # calib_path: "./output/new_calibration.yaml"   # default: next to output_dir

correction:
  z0_fixed: 1.0           # scene depth for fixed-depth mode and the zoom search
  zoom: null              # null = automatic (best in-bounds zoom at z0_fixed)
  step_size: 1            # process every n-th image
  crop_valid_bbox: true   # crop to the largest rectangle without invalid pixels
