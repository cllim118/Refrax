[workspace]
channels = ["conda-forge"]
name = "refrax"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
remove-refraction = "python remove_refraction.py"
visualise-refraction = "python visualise_refraction.py"
planarity = "python evaluation/planarity.py"

[dependencies]
python = ">=3.10"
numpy = ">=1.24"
scipy = ">=1.10"
matplotlib = ">=3.7"
opencv = ">=4.8"
pyyaml = ">=6.0"
